<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/png" href="assets/images/favicon.png" />
  <title>Page Not Found | Surf Coast Cricket Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #1E1A1A;
      color: #F5F0EE;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 5%;
    }
    img { width: min(120px, 30vw); margin-bottom: 32px; opacity: 0.85; }
    .num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(100px, 20vw, 180px);
      line-height: 1;
      color: #C9A020;
      letter-spacing: 4px;
    }
    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(28px, 5vw, 48px);
      letter-spacing: 2px;
      margin-top: 8px;
      color: #F5F0EE;
    }
    p {
      margin-top: 16px;
      font-size: 16px;
      color: rgba(245,240,238,0.6);
      max-width: 420px;
      line-height: 1.7;
    }
    a.btn {
      display: inline-block;
      margin-top: 36px;
      padding: 14px 36px;
      background: linear-gradient(135deg, #C9A020, #E8BF2A);
      color: #1A1A1A;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.5px;
      transition: opacity 0.2s, transform 0.2s;
    }
    a.btn:hover { opacity: 0.9; transform: translateY(-2px); }
    .divider {
      width: 48px;
      height: 3px;
      background: #E8001C;
      border-radius: 2px;
      margin: 28px auto 0;
    }
  </style>
</head>
<body>
  <img src="assets/images/sccc-logo.png" alt="Surf Coast Cricket Club" />
  <div class="num">404</div>
  <h1>Page Not Found</h1>
  <div class="divider"></div>
  <p>That delivery went wide. The page you&rsquo;re looking for doesn&rsquo;t exist or may have moved.</p>
